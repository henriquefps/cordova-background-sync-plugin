<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Database Inspector</title>
<style>
  :root {
    --bg: #f3f4f6;
    --card-bg: #ffffff;
    --text: #1f2937;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --primary: #4f46e5;
    --danger: #ef4444;
    --danger-bg: #fee2e2;
    --success: #10b981;
    --warning: #f59e0b;
    --warning-bg: #fef3c7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    /* env(safe-area-inset-top) keeps the header clear of the status bar / notch on
       edge-to-edge layouts (Android 15+ targetSdk, iOS notch/Dynamic Island). Padding, not
       margin, so the offset holds even once this sticky header is scrolled to top:0 — a
       margin would only apply before the first scroll, then the header would jump back
       under the status bar. Declared twice: a plain fallback first (kept by WebViews too
       old to parse env() at all — those treat the whole env() declaration as invalid and
       drop it, not just fall back to 0), then the real one that WebViews which do support
       it will apply instead. */
    padding: 0.9rem 1rem;
    padding-top: calc(0.9rem + env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 1.05rem;
    margin: 0;
  }
  .btn {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.5rem 0.9rem;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-secondary { background: #e5e7eb; color: var(--text); }
  .btn-danger { background: var(--danger-bg); color: var(--danger); }
  .btn-success { background: #d1fae5; color: #047857; }
  .btn-small { font-size: 0.75rem; padding: 0.3rem 0.6rem; border-radius: 6px; }
  .btn-link {
    background: none;
    border: none;
    color: var(--primary);
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.15rem 0;
    cursor: pointer;
    text-decoration: underline;
  }
  .btn:disabled { opacity: 0.5; cursor: default; }

  /* ---- Config panel ---- */
  .config-panel {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 0.6rem 1rem;
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .config-panel .config-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem 1.25rem;
    align-items: baseline;
  }
  .config-panel strong { color: var(--text); font-weight: 600; }
  .config-panel .config-label { color: var(--text-muted); margin-right: 0.25rem; }
  .config-panel code {
    font-family: ui-monospace, 'SF Mono', Consolas, monospace;
    font-size: 0.72rem;
    background: #f3f4f6;
    padding: 0.1rem 0.35rem;
    border-radius: 4px;
  }
  .config-panel .config-missing { color: var(--danger); font-weight: 600; }
  .config-toggle {
    font-size: 0.72rem;
    color: var(--primary);
    cursor: pointer;
    font-weight: 600;
    margin-left: 0.5rem;
  }

  /* ---- Tabs / summary ---- */
  .tabs {
    display: flex;
    gap: 0.5rem;
    padding: 0.75rem 1rem 0;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 0.6rem 1rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  .tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }
  main {
    padding: 1rem;
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .toolbar .count {
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .summary-bar {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 0.75rem;
  }
  .summary-chip {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    border: 1.5px solid transparent;
    cursor: pointer;
    background: #fff;
    color: var(--text-muted);
    border-color: var(--border);
  }
  .summary-chip.active { border-color: currentColor; }
  .summary-chip[data-status="pending"] { color: #d97706; }
  .summary-chip[data-status="failed"] { color: var(--danger); }
  .summary-chip[data-status="completed"] { color: var(--success); }
  .summary-chip[data-status="all"] { color: var(--primary); }
  .table-wrapper {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }
  th, td {
    padding: 0.6rem 0.75rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  th {
    background: #f9fafb;
    font-weight: 600;
    white-space: nowrap;
  }
  tr:last-child td { border-bottom: none; }
  td.mono {
    font-family: ui-monospace, 'SF Mono', Consolas, monospace;
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  td.id-cell { display: flex; align-items: baseline; gap: 0.35rem; }
  td.wrap-cell {
    max-width: 260px;
    overflow-wrap: break-word;
    word-break: break-all;
  }
  td.wrap-cell pre {
    margin: 0 0 0.25rem;
    max-height: 90px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-all;
    font-family: ui-monospace, 'SF Mono', Consolas, monospace;
    font-size: 0.72rem;
  }
  .row-actions { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .badge {
    display: inline-block;
    padding: 0.2rem 0.55rem;
    border-radius: 6px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
  }
  .badge.pending { background: var(--warning-bg); color: #d97706; }
  .badge.failed { background: var(--danger-bg); color: var(--danger); }
  .badge.completed { background: #d1fae5; color: var(--success); }
  .badge.unknown { background: #e5e7eb; color: var(--text-muted); }
  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-muted);
    font-size: 0.9rem;
  }
  .error-banner {
    background: var(--danger-bg);
    color: var(--danger);
    padding: 0.75rem 1rem;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 0.75rem;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 1.25rem;
    transform: translateX(-50%);
    background: #111827;
    color: #fff;
    padding: 0.55rem 1rem;
    border-radius: 8px;
    font-size: 0.8rem;
    z-index: 1100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .toast.visible { opacity: 1; }
  .loading {
    padding: 2rem;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  /* ---- Modal (used for confirm + "view full") ---- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 1rem;
  }
  .modal-box {
    background: #fff; border-radius: 12px; padding: 1.25rem;
    max-width: 320px; width: 100%;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  }
  .modal-box.modal-wide { max-width: 92vw; max-height: 85vh; display: flex; flex-direction: column; }
  .modal-box p { margin: 0 0 1rem; font-size: 0.9rem; color: #1f2937; line-height: 1.4; }
  .modal-box h2 { margin: 0 0 0.75rem; font-size: 0.95rem; }
  .modal-box pre {
    background: #f9fafb; border: 1px solid var(--border); border-radius: 8px;
    padding: 0.75rem; font-size: 0.75rem; overflow: auto; flex: 1;
    white-space: pre-wrap; word-break: break-all;
    font-family: ui-monospace, 'SF Mono', Consolas, monospace;
    margin: 0 0 0.75rem;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; }
</style>
</head>
<body>

<header>
  <h1>Database Inspector</h1>
  <div style="display:flex; gap:0.5rem;">
    <button class="btn btn-primary" id="exportBtn">Export All (JSON)</button>
    <button class="btn btn-secondary" id="closeBtn">Close</button>
  </div>
</header>

<div class="config-panel" id="configPanel">Loading config…</div>

<div class="tabs">
  <div class="tab active" data-tab="sync">Sync Queue (Uploads)</div>
  <div class="tab" data-tab="download">Download Queue</div>
</div>

<main>
  <div id="errorBanner" class="error-banner" style="display:none;"></div>

  <div class="panel active" id="panel-sync">
    <div class="toolbar">
      <span class="count" id="syncCount"></span>
      <button class="btn btn-secondary btn-small" id="refreshSyncBtn">Refresh</button>
    </div>
    <div class="summary-bar" id="syncSummary"></div>
    <div id="syncContent" class="loading">Loading...</div>
  </div>

  <div class="panel" id="panel-download">
    <div class="toolbar">
      <span class="count" id="downloadCount"></span>
      <button class="btn btn-secondary btn-small" id="refreshDownloadBtn">Refresh</button>
    </div>
    <div class="summary-bar" id="downloadSummary"></div>
    <div id="downloadContent" class="loading">Loading...</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ---- Native bridge adapter --------------------------------------------
  // Android exposes a single synchronous entry point: AndroidInspectorBridge.invoke(action, argsJson).
  // iOS exposes an async postMessage handler; the native side resolves by calling
  // window.__inspectorResolve(callId, jsonString) back into this page.
  var Bridge = (function () {
    var isAndroid = !!window.AndroidInspectorBridge;
    var isIOS = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.inspectorBridge);
    var callId = 0;
    var pending = {};

    window.__inspectorResolve = function (id, jsonString) {
      var entry = pending[id];
      if (!entry) return;
      delete pending[id];
      try {
        entry.resolve(JSON.parse(jsonString));
      } catch (e) {
        entry.reject(e);
      }
    };

    function callIOS(action, argsObj) {
      return new Promise(function (resolve, reject) {
        var id = ++callId;
        pending[id] = { resolve: resolve, reject: reject };
        window.webkit.messageHandlers.inspectorBridge.postMessage({ callId: id, action: action, args: argsObj || {} });
      });
    }

    function callAndroid(action, argsObj) {
      return new Promise(function (resolve, reject) {
        try {
          var raw = window.AndroidInspectorBridge.invoke(action, JSON.stringify(argsObj || {}));
          resolve(JSON.parse(raw));
        } catch (e) {
          reject(e);
        }
      });
    }

    function call(action, argsObj) {
      if (isAndroid) return callAndroid(action, argsObj);
      if (isIOS) return callIOS(action, argsObj);
      return Promise.reject(new Error('No native inspector bridge is available in this context.'));
    }

    return {
      getSyncQueue: function () { return call('getSyncQueue'); },
      getDownloadQueue: function () { return call('getDownloadQueue'); },
      getSyncRecordDetail: function (id) { return call('getSyncRecordDetail', { id: id }); },
      getDownloadRecordDetail: function (id) { return call('getDownloadRecordDetail', { id: id }); },
      deleteSyncRecord: function (id) { return call('deleteSyncRecord', { id: id }); },
      deleteDownloadRecord: function (id) { return call('deleteDownloadRecord', { id: id }); },
      retrySyncRecord: function (id) { return call('retrySyncRecord', { id: id }); },
      retryDownloadRecord: function (id) { return call('retryDownloadRecord', { id: id }); },
      getConfig: function () { return call('getConfig'); },
      exportAll: function () { return call('exportAll'); },
      close: function () { return call('close'); }
    };
  })();

  // ---- Helpers ------------------------------------------------------------
  function esc(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function isTruncated(value) {
    return typeof value === 'string' && value.indexOf('<TRUNCATED:') !== -1;
  }

  function showToast(message) {
    var toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('visible');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.classList.remove('visible'); }, 1800);
  }

  // Works reliably inside a Cordova WebView, unlike navigator.clipboard.writeText, which
  // needs a secure-context + permission dance that plain file:// / WKWebView hosts don't grant.
  function copyToClipboard(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { /* no-op */ }
    document.body.removeChild(ta);
    showToast(ok ? 'Copied to clipboard' : 'Copy failed');
  }

  // window.confirm()/alert() require native WKUIDelegate (iOS) / WebChromeClient (Android)
  // wiring that this inspector's host views don't provide, so they silently no-op instead of
  // showing a dialog. This in-page modal works identically on both platforms without it.
  function showConfirm(message) {
    return new Promise(function (resolve) {
      var overlay = document.createElement('div');
      overlay.className = 'modal-overlay';

      var box = document.createElement('div');
      box.className = 'modal-box';

      var text = document.createElement('p');
      text.textContent = message;

      var actions = document.createElement('div');
      actions.className = 'modal-actions';

      var cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn btn-secondary btn-small';
      cancelBtn.textContent = 'Cancel';

      var confirmBtn = document.createElement('button');
      confirmBtn.className = 'btn btn-danger btn-small';
      confirmBtn.textContent = 'Delete';

      actions.appendChild(cancelBtn);
      actions.appendChild(confirmBtn);
      box.appendChild(text);
      box.appendChild(actions);
      overlay.appendChild(box);
      document.body.appendChild(overlay);

      function cleanup(result) {
        document.body.removeChild(overlay);
        resolve(result);
      }
      cancelBtn.addEventListener('click', function () { cleanup(false); });
      confirmBtn.addEventListener('click', function () { cleanup(true); });
      overlay.addEventListener('click', function (e) { if (e.target === overlay) cleanup(false); });
    });
  }

  // Fetches the untruncated record and shows one field's full value in a scrollable modal,
  // with its own copy-to-clipboard — for a truncated Payload/Error/ResponseData cell.
  function showFullField(fetchDetail, id, fieldName) {
    fetchDetail(id).then(function (record) {
      if (record && record.error) throw new Error(record.error);
      var value = record ? record[fieldName] : '';

      var overlay = document.createElement('div');
      overlay.className = 'modal-overlay';

      var box = document.createElement('div');
      box.className = 'modal-box modal-wide';

      var title = document.createElement('h2');
      title.textContent = fieldName + ' — full value (' + (value ? value.length : 0) + ' chars)';

      var pre = document.createElement('pre');
      pre.textContent = value || '';

      var actions = document.createElement('div');
      actions.className = 'modal-actions';

      var copyBtn = document.createElement('button');
      copyBtn.className = 'btn btn-secondary btn-small';
      copyBtn.textContent = 'Copy';
      copyBtn.addEventListener('click', function () { copyToClipboard(value || ''); });

      var closeBtn = document.createElement('button');
      closeBtn.className = 'btn btn-primary btn-small';
      closeBtn.textContent = 'Close';

      actions.appendChild(copyBtn);
      actions.appendChild(closeBtn);
      box.appendChild(title);
      box.appendChild(pre);
      box.appendChild(actions);
      overlay.appendChild(box);
      document.body.appendChild(overlay);

      function cleanup() { document.body.removeChild(overlay); }
      closeBtn.addEventListener('click', cleanup);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) cleanup(); });
    }).catch(function (e) {
      showError('Failed to load full value: ' + (e && e.message ? e.message : e));
    });
  }

  function statusBadge(status) {
    var normalized = (status || '').toLowerCase();
    var cls = ['pending', 'failed', 'completed'].indexOf(normalized) >= 0 ? normalized : 'unknown';
    return '<span class="badge ' + cls + '">' + esc(status || 'unknown') + '</span>';
  }

  function showError(message) {
    var banner = document.getElementById('errorBanner');
    banner.textContent = message;
    banner.style.display = message ? 'block' : 'none';
  }

  function cellWithField(rawValue, id, fieldName) {
    var html = '<pre>' + esc(rawValue) + '</pre>';
    if (isTruncated(rawValue)) {
      html += '<button class="btn-link" data-view-full data-field="' + esc(fieldName) + '" data-id="' + esc(id) + '">View full</button>';
    }
    return html;
  }

  function wireViewFullButtons(container, fetchDetail) {
    Array.prototype.forEach.call(container.querySelectorAll('[data-view-full]'), function (btn) {
      btn.addEventListener('click', function () {
        showFullField(fetchDetail, btn.getAttribute('data-id'), btn.getAttribute('data-field'));
      });
    });
  }

  // ---- Config panel ---------------------------------------------------------
  function loadConfig() {
    var panel = document.getElementById('configPanel');
    Bridge.getConfig().then(function (config) {
      if (config && config.error) throw new Error(config.error);
      var headerParts = [];
      var headers = config.headers || {};
      Object.keys(headers).forEach(function (key) {
        headerParts.push('<code>' + esc(key) + ': ' + esc(headers[key]) + '</code>');
      });
      var serverUrlHtml = config.serverUrl
        ? '<code>' + esc(config.serverUrl) + '</code>'
        : '<span class="config-missing">not set</span>';
      panel.innerHTML =
        '<div class="config-row">' +
        '<span><span class="config-label">Server URL:</span><strong>' + serverUrlHtml + '</strong></span>' +
        '<span><span class="config-label">Encrypted DB:</span><strong>' + (config.encryptDatabase ? 'Yes' : 'No') + '</strong></span>' +
        '<span><span class="config-label">Headers:</span>' + (headerParts.length ? headerParts.join(' ') : '<span class="config-missing">none configured</span>') + '</span>' +
        '</div>';
    }).catch(function (e) {
      panel.innerHTML = '<span class="config-missing">Failed to load config: ' + esc(e && e.message ? e.message : e) + '</span>';
    });
  }

  // ---- Filter state ---------------------------------------------------------
  var syncFilter = 'all';
  var downloadFilter = 'all';
  var lastSyncRows = [];
  var lastDownloadRows = [];

  function countByStatus(rows) {
    var counts = { pending: 0, failed: 0, completed: 0, other: 0 };
    rows.forEach(function (row) {
      var s = (row.Status || '').toLowerCase();
      if (counts.hasOwnProperty(s)) counts[s]++;
      else counts.other++;
    });
    return counts;
  }

  function renderSummaryBar(containerId, rows, currentFilter, onFilterChange) {
    var counts = countByStatus(rows);
    var chips = [
      { key: 'all', label: 'All', count: rows.length },
      { key: 'pending', label: 'Pending', count: counts.pending },
      { key: 'failed', label: 'Failed', count: counts.failed },
      { key: 'completed', label: 'Completed', count: counts.completed }
    ];
    var container = document.getElementById(containerId);
    container.innerHTML = chips.map(function (c) {
      return '<button class="summary-chip' + (currentFilter === c.key ? ' active' : '') + '" data-status="' + c.key + '">' +
        c.label + ' (' + c.count + ')</button>';
    }).join('');
    Array.prototype.forEach.call(container.querySelectorAll('.summary-chip'), function (chip) {
      chip.addEventListener('click', function () { onFilterChange(chip.getAttribute('data-status')); });
    });
  }

  function filterRows(rows, filter) {
    if (filter === 'all') return rows;
    return rows.filter(function (row) { return (row.Status || '').toLowerCase() === filter; });
  }

  // ---- Sync Queue rendering -------------------------------------------
  function renderSyncQueue(rows) {
    lastSyncRows = rows;
    renderSummaryBar('syncSummary', rows, syncFilter, function (status) {
      syncFilter = status;
      renderSyncQueue(lastSyncRows);
    });

    var visible = filterRows(rows, syncFilter);
    document.getElementById('syncCount').textContent = visible.length + ' of ' + rows.length + ' record(s)';
    if (visible.length === 0) {
      document.getElementById('syncContent').innerHTML = '<div class="empty-state">' +
        (rows.length === 0 ? 'Sync queue is empty.' : 'No records match this filter.') + '</div>';
      return;
    }
    var html = '<div class="table-wrapper"><table><thead><tr>' +
      '<th>Seq</th><th>Id</th><th>Status</th><th>Endpoint</th><th>Strategy</th><th>FilePath</th><th>Payload</th><th>Error</th><th></th>' +
      '</tr></thead><tbody>';
    visible.forEach(function (row) {
      html += '<tr>' +
        '<td class="mono">' + esc(row.Sequence) + '</td>' +
        '<td class="mono id-cell">' + esc(row.Id) + '<button class="btn-link" data-copy-id="' + esc(row.Id) + '">copy</button></td>' +
        '<td>' + statusBadge(row.Status) + '</td>' +
        '<td class="wrap-cell">' + esc(row.Endpoint) + '</td>' +
        '<td>' + esc(row.UploadStrategy) + '</td>' +
        '<td class="wrap-cell">' + esc(row.FilePath) + '</td>' +
        '<td class="wrap-cell">' + cellWithField(row.Payload, row.Id, 'Payload') + '</td>' +
        '<td class="wrap-cell">' + cellWithField(row.Error, row.Id, 'Error') + '</td>' +
        '<td><div class="row-actions">' +
        '<button class="btn btn-success btn-small" data-retry-sync="' + esc(row.Id) + '">Retry</button>' +
        '<button class="btn btn-danger btn-small" data-delete-sync="' + esc(row.Id) + '">Delete</button>' +
        '</div></td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';
    var content = document.getElementById('syncContent');
    content.innerHTML = html;
    wireViewFullButtons(content, Bridge.getSyncRecordDetail);

    Array.prototype.forEach.call(content.querySelectorAll('[data-copy-id]'), function (btn) {
      btn.addEventListener('click', function () { copyToClipboard(btn.getAttribute('data-copy-id')); });
    });

    Array.prototype.forEach.call(content.querySelectorAll('[data-delete-sync]'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-delete-sync');
        showConfirm('Delete sync_queue record ' + id + '? This cannot be undone.').then(function (confirmed) {
          if (!confirmed) return;
          return Bridge.deleteSyncRecord(id).then(loadSyncQueue);
        }).catch(function (e) {
          showError('Failed to delete record: ' + (e && e.message ? e.message : e));
        });
      });
    });

    Array.prototype.forEach.call(content.querySelectorAll('[data-retry-sync]'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-retry-sync');
        btn.disabled = true;
        Bridge.retrySyncRecord(id).then(function (res) {
          if (res && res.error) throw new Error(res.error);
          showToast('Marked as pending — will retry on next sync');
          return loadSyncQueue();
        }).catch(function (e) {
          btn.disabled = false;
          showError('Failed to retry record: ' + (e && e.message ? e.message : e));
        });
      });
    });
  }

  function loadSyncQueue() {
    document.getElementById('syncContent').innerHTML = '<div class="loading">Loading...</div>';
    return Bridge.getSyncQueue().then(function (rows) {
      showError('');
      renderSyncQueue(Array.isArray(rows) ? rows : []);
    }).catch(function (e) {
      showError('Failed to load sync queue: ' + (e && e.message ? e.message : e));
      document.getElementById('syncContent').innerHTML = '';
    });
  }

  // ---- Download Queue rendering -----------------------------------------
  function renderDownloadQueue(rows) {
    lastDownloadRows = rows;
    renderSummaryBar('downloadSummary', rows, downloadFilter, function (status) {
      downloadFilter = status;
      renderDownloadQueue(lastDownloadRows);
    });

    var visible = filterRows(rows, downloadFilter);
    document.getElementById('downloadCount').textContent = visible.length + ' of ' + rows.length + ' record(s)';
    if (visible.length === 0) {
      document.getElementById('downloadContent').innerHTML = '<div class="empty-state">' +
        (rows.length === 0 ? 'Download queue is empty.' : 'No records match this filter.') + '</div>';
      return;
    }
    var html = '<div class="table-wrapper"><table><thead><tr>' +
      '<th>Seq</th><th>Id</th><th>Status</th><th>Endpoint</th><th>Strategy</th><th>FilePath</th><th>ResponseData</th><th>Error</th><th></th>' +
      '</tr></thead><tbody>';
    visible.forEach(function (row) {
      html += '<tr>' +
        '<td class="mono">' + esc(row.Sequence) + '</td>' +
        '<td class="mono id-cell">' + esc(row.Id) + '<button class="btn-link" data-copy-id="' + esc(row.Id) + '">copy</button></td>' +
        '<td>' + statusBadge(row.Status) + '</td>' +
        '<td class="wrap-cell">' + esc(row.Endpoint) + '</td>' +
        '<td>' + esc(row.DownloadStrategy) + '</td>' +
        '<td class="wrap-cell">' + esc(row.FilePath) + '</td>' +
        '<td class="wrap-cell">' + cellWithField(row.ResponseData, row.Id, 'ResponseData') + '</td>' +
        '<td class="wrap-cell">' + cellWithField(row.Error, row.Id, 'Error') + '</td>' +
        '<td><div class="row-actions">' +
        '<button class="btn btn-success btn-small" data-retry-download="' + esc(row.Id) + '">Retry</button>' +
        '<button class="btn btn-danger btn-small" data-delete-download="' + esc(row.Id) + '">Delete</button>' +
        '</div></td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';
    var content = document.getElementById('downloadContent');
    content.innerHTML = html;
    wireViewFullButtons(content, Bridge.getDownloadRecordDetail);

    Array.prototype.forEach.call(content.querySelectorAll('[data-copy-id]'), function (btn) {
      btn.addEventListener('click', function () { copyToClipboard(btn.getAttribute('data-copy-id')); });
    });

    Array.prototype.forEach.call(content.querySelectorAll('[data-delete-download]'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-delete-download');
        showConfirm('Delete download_queue record ' + id + '? This cannot be undone.').then(function (confirmed) {
          if (!confirmed) return;
          return Bridge.deleteDownloadRecord(id).then(loadDownloadQueue);
        }).catch(function (e) {
          showError('Failed to delete record: ' + (e && e.message ? e.message : e));
        });
      });
    });

    Array.prototype.forEach.call(content.querySelectorAll('[data-retry-download]'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-retry-download');
        btn.disabled = true;
        Bridge.retryDownloadRecord(id).then(function (res) {
          if (res && res.error) throw new Error(res.error);
          showToast('Marked as pending — will retry on next sync');
          return loadDownloadQueue();
        }).catch(function (e) {
          btn.disabled = false;
          showError('Failed to retry record: ' + (e && e.message ? e.message : e));
        });
      });
    });
  }

  function loadDownloadQueue() {
    document.getElementById('downloadContent').innerHTML = '<div class="loading">Loading...</div>';
    return Bridge.getDownloadQueue().then(function (rows) {
      showError('');
      renderDownloadQueue(Array.isArray(rows) ? rows : []);
    }).catch(function (e) {
      showError('Failed to load download queue: ' + (e && e.message ? e.message : e));
      document.getElementById('downloadContent').innerHTML = '';
    });
  }

  // ---- Tabs ---------------------------------------------------------------
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (tab) {
    tab.addEventListener('click', function () {
      var target = tab.getAttribute('data-tab');
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) { t.classList.remove('active'); });
      Array.prototype.forEach.call(document.querySelectorAll('.panel'), function (p) { p.classList.remove('active'); });
      tab.classList.add('active');
      document.getElementById('panel-' + target).classList.add('active');
    });
  });

  // ---- Toolbar actions ----------------------------------------------------
  document.getElementById('refreshSyncBtn').addEventListener('click', loadSyncQueue);
  document.getElementById('refreshDownloadBtn').addEventListener('click', loadDownloadQueue);
  document.getElementById('closeBtn').addEventListener('click', function () {
    Bridge.close().catch(function () { /* no-op: native side closes the screen regardless */ });
  });
  document.getElementById('exportBtn').addEventListener('click', function () {
    showError('');
    Bridge.exportAll().catch(function (e) {
      showError('Export failed: ' + (e && e.message ? e.message : e));
    });
  });

  // ---- Initial load ---------------------------------------------------------
  loadConfig();
  loadSyncQueue();
  loadDownloadQueue();
})();
</script>

</body>
</html>
